services:
  operator:
    build: .
    image: husky-operator
    # Default bridge (docker0): own IP; reaches the NATIVE host master via the
    # docker0 gateway IP passed in ROBOT_HOST_IP.
    ports:
      - "6080:6080"
    environment:
      # Supply at runtime: ROBOT_HOST_IP=<docker0 gateway IP>. No hardcoding.
      ROS_MASTER_URI: "http://${ROBOT_HOST_IP}:11311"
      LP_NUM_THREADS: "4"
      # `docker compose exec` shells are non-login/non-interactive, so bash
      # sources BASH_ENV (and only BASH_ENV) before running the command.
      # entrypoint.sh writes ROS sourcing + this container's ROS_IP there, so
      # `docker compose exec operator bash -c "..."` gets a working ROS env
      # without repeating `source /opt/ros/noetic/setup.bash` by hand.
      BASH_ENV: "/etc/ros_env.sh"
      # Named-objects table behind `goal <name>`. Defaults to park; set
      # OBJECTS_PATH=/repo/maps/lake_objects.yaml in the environment (or export
      # it before `docker compose up`) to drive the lake world by name instead.
      OBJECTS_PATH: "${OBJECTS_PATH:-/repo/maps/park_objects.yaml}"
      # Which world's DTM the entrypoint publishes on /dtm_cloud + /water_cloud.
      # MUST be declared here or a shell-level DTM_WORLD never reaches the
      # container and it silently falls back to the default -- which is how a
      # park run ended up displaying the lake's terrain. Set DTM_WORLD=park (or
      # lake) before `docker compose up`. Empty disables the DTM layers.
      DTM_WORLD: "${DTM_WORLD:-lake}"
      # Optional explicit z offset for those layers; the entrypoint computes one
      # from the world's spawn point when this is unset.
      DTM_Z_OFFSET: "${DTM_Z_OFFSET:-}"
    volumes:
      # Repo mounted rw so operate.py can write operator_run.csv, and so its
      # `from send_mapless_goal import ...` resolves from /repo.
      - ../:/repo
    working_dir: /repo
    stdin_open: true
    tty: true

networks:
  default:
    name: husky_lan
    external: true
