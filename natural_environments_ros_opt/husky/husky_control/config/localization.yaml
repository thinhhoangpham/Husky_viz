odom_frame: odom
base_link_frame: base_link
world_frame: odom

# two_d_mode OFF: the robot drives on real terrain (the lake has 2.4 m of relief and
# measured local slopes up to 24 deg), so forcing z/roll/pitch to zero made the fused
# pose describe a robot that does not exist -- and every consumer of odom->base_link
# (the whole base_link -> os0_sensor -> os0_lidar chain, hence RViz) inherited that
# flat frame. With it off, z comes from odom1 (lidar ground height) and roll/pitch
# come from imu1 (compass); see those blocks below.
two_d_mode: false

predict_to_current_time: true

frequency: 50

odom0: husky_velocity_controller/odom
odom0_config: [false, false, false,
               false, false, false,
               true, true, true,
               false, false, true,
               false, false, false]
odom0_differential: false
odom0_queue_size: 10

imu0: imu/data
imu0_config: [false, false, false,
              false, false, false,
              false, false, false,
              false, false, false,
              false, false, false]
imu0_differential: true
imu0_queue_size: 10
imu0_remove_gravitational_acceleration: true

# compass/data is a full IMU whose orientation is gravity-referenced (measured live:
# gravity 9.78 on Z, roll -3.78 deg, pitch 0.53 deg), so it supplies ABSOLUTE roll and
# pitch as well as the absolute yaw it already provided. Fusing roll+pitch is what lets
# base_link tilt with the terrain once two_d_mode is off. Absolute (differential: false).
imu1: compass/data
imu1_config: [false, false, false,
              true,  true,  true,
              false, false, false,
              false, false, false,
              false, false, false]
imu1_differential: false
imu1_queue_size: 10

# --- Absolute z: DTM terrain height + chassis clearance (odom1) ---------------
# NOTHING else in this filter observes z. The wheel odometry's vz is structurally
# zero on a skid-steer and no other input carries height, so without this block z
# is an UNOBSERVED state -- it settles at 0 and the robot renders ~3.75 m BELOW the
# terrain it is standing on (measured: DTM 3.747 m at the robot's x,y, map->base_link
# z 0.000). odom1 supplies the missing measurement.
#
# THE TOPIC IS odometry/ground_height_odom, NOT odometry/ground_height.
# Both are published by scripts/publish_ground_height_odom.py and carry the SAME
# number; they differ only in header.frame_id. This filter must read the copy
# stamped "odom", because robot_localization transforms a pose measurement into
# world_frame before fusing it: preparePose looks up
# `world_frame <- msg.header.frame_id` (ros_filter.cpp ~2713) and applies it at
# ~3021. This filter's world_frame is "odom", so an "odom" stamp makes that the
# identity and the measurement arrives unmodified.
#
# Reading the "map"-stamped copy here is a REAL bug that was live in this file:
# the transform becomes odom<-map, whose z is -(map->odom).z. Writing
# M = (map->base_link).z and O = (odom->base_link).z, the map filter drives M to
# the true height T and emits map->odom = M - O, so this filter would fuse
# T - (M - O) = O -- its own current estimate. The measurement cancels itself
# exactly, z goes UNOBSERVED again, and the filter freezes at whatever height it
# had drifted to. Measured: /odometry/ground_height 3.893 but filtered_odom 5.927,
# with map->odom = -2.034 hiding it so the composed map->base_link still read 3.893.
# The local costmap runs in THIS frame (config/costmap_local_gps.yaml,
# global_frame: odom), so it consumed the 2 m error directly.
#
# The source is scripts/publish_ground_height_odom.py, which publishes
# z = dtm_elevation_at(x, y) + clearance:
#   * clearance   - fixed chassis geometry, read once from TF as
#                 -(base_link->base_footprint).z = 0.13228 m on this Husky. It is
#                 NOT a lidar ground-plane fit any more: that fit read 0.08 m on
#                 flat ground but 0.41 m on a slope, and the error propagated
#                 straight into the fused z.
#   * ground_elev - terrain elevation under the robot from the prior DTM
#                 (~dtm_path). REQUIRED: it is the node's only terrain source, and
#                 the node exits rather than publish without it.
# No Gazebo ground truth is involved: the clearance is URDF-derived TF and the DTM
# is an offline map file.
#
# We fuse z ONLY -- no x, y (meaningless in that message; its covariance sets them
# to 1e6), no orientation (roll/pitch come from imu1, yaw from the compass), no
# velocities. Absolute (differential: false), because it is a direct measurement of
# elevation, not a delta.
odom1: odometry/ground_height_odom
odom1_config: [false, false, true,
               false, false, false,
               false, false, false,
               false, false, false,
               false, false, false]
odom1_differential: false
odom1_queue_size: 10
