odom_frame: odom
base_link_frame: base_link
world_frame: odom

# two_d_mode OFF: the robot drives on real terrain (the lake has 2.4 m of relief and
# measured local slopes up to 24 deg), so forcing z/roll/pitch to zero made the fused
# pose describe a robot that does not exist -- and every consumer of odom->base_link
# (the whole base_link -> os0_sensor -> os0_lidar chain, hence RViz) inherited that
# flat frame. With it off, z comes from odom1 (lidar ground height) and roll/pitch
# come from imu1 (compass); see those blocks below.
two_d_mode: false

predict_to_current_time: true

frequency: 50

odom0: husky_velocity_controller/odom
odom0_config: [false, false, false,
               false, false, false,
               true, true, true,
               false, false, true,
               false, false, false]
odom0_differential: false
odom0_queue_size: 10

imu0: imu/data
imu0_config: [false, false, false,
              false, false, false,
              false, false, false,
              false, false, false,
              false, false, false]
imu0_differential: true
imu0_queue_size: 10
imu0_remove_gravitational_acceleration: true

# compass/data is a full IMU whose orientation is gravity-referenced (measured live:
# gravity 9.78 on Z, roll -3.78 deg, pitch 0.53 deg), so it supplies ABSOLUTE roll and
# pitch as well as the absolute yaw it already provided. Fusing roll+pitch is what lets
# base_link tilt with the terrain once two_d_mode is off. Absolute (differential: false).
imu1: compass/data
imu1_config: [false, false, false,
              true,  true,  true,
              false, false, false,
              false, false, false,
              false, false, false]
imu1_differential: false
imu1_queue_size: 10

# --- Absolute z: lidar ground-height fit + prior DTM (odom1) -------------------
# NOTHING else in this filter observes z. The wheel odometry's vz is structurally
# zero on a skid-steer and no other input carries height, so without this block z
# is an UNOBSERVED state -- it settles at 0 and the robot renders ~3.75 m BELOW the
# terrain it is standing on (measured: DTM 3.747 m at the robot's x,y, map->base_link
# z 0.000). odom1 supplies the missing measurement.
#
# The source is scripts/publish_ground_height_odom.py, which publishes
# /odometry/ground_height as z = ground_elev + (h_sensor - mount_dz):
#   * h_sensor  - the SENSOR's height above the local ground, from a plane fit to
#                 the lidar's low returns after de-rotating by the compass's
#                 gravity-referenced roll/pitch. Sensor-derived.
#   * mount_dz  - the fixed base_link->os0_lidar offset, read from TF, not hardcoded.
#   * ground_elev - terrain elevation under the robot from the prior DTM
#                 (~dtm_path). REQUIRED: without it the node publishes CLEARANCE
#                 only, the EKF reads that as absolute elevation, and the robot
#                 sinks under the map again. The node logs a warning when ~dtm_path
#                 is unset -- if the robot renders low, check that first.
# No Gazebo ground truth is involved: the clearance is measured by the lidar and the
# DTM is an offline map file.
#
# We fuse z ONLY -- no x, y (meaningless in that message; its covariance sets them
# to 1e6), no orientation (roll/pitch come from imu1, yaw from the compass), no
# velocities. Absolute (differential: false), because it is a direct measurement of
# elevation, not a delta.
#
# KNOWN CONSEQUENCE -- PRESERVED FROM THE EARLIER REVERT, STILL TRUE:
# the costmap's obstacle layer classifies a point as an obstacle by its height in a
# fixed 0.15-1.2 m band (config/costmap_common_gps.yaml), and that band was
# calibrated for a robot sitting at z~0. Raising the robot to its true elevation
# moved the ground out of that band and previously filled the local costmap with
# false obstacles -- measured at ~8.3% lethal cells around the robot. That is why
# this input was reverted once before. It is re-enabled here because the robot's z
# must be TRUE; the costmap band is deliberately NOT touched in this change, so
# expect the false-lethal behaviour to return until the band is addressed
# separately. Watch the local costmap when running with this enabled.
odom1: odometry/ground_height
odom1_config: [false, false, true,
               false, false, false,
               false, false, false,
               false, false, false,
               false, false, false]
odom1_differential: false
odom1_queue_size: 10
