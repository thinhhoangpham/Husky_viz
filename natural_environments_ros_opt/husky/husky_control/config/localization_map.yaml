# MAP-frame EKF  (robot_localization ekf_localization_node)
# ---------------------------------------------------------------------------
# This is the SECOND EKF in a standard robot_localization dual-EKF topology.
# It produces the GLOBALLY anchored, GPS-corrected estimate that the autonomous
# driver navigates on.
#
# WHY A SECOND EKF AND NOT JUST ONE:
# robot_localization's design splits localization into two filters so the TF
# tree stays continuous AND globally correct at the same time:
#   * odom-frame EKF  (localization.yaml)  -> publishes  odom -> base_link
#         smooth, continuous, no jumps, but drifts. Fuses wheel odom + IMU.
#   * map-frame EKF   (THIS FILE)          -> publishes  map  -> odom
#         globally accurate, corrects drift with GPS, may jump on a GPS update.
# Composed, the TF tree is  map -> odom -> base_link, which is what every ROS
# consumer expects. Neither filter ever publishes the same transform, so there
# is no TF conflict.
#
# WHAT THIS FILTER FUSES:
#   odom0 = husky_velocity_controller/odom   wheel odometry (vx, vyaw)
#   imu0  = imu/data                         yaw RATE only (NOT absolute yaw --
#                                            imu/data is mounted 90deg wrong)
#   imu1  = compass/data                     ABSOLUTE yaw (drift-free heading
#                                            anchor; added by the compass fix)
#   odom1 = odometry/abs_fix                 ABSOLUTE x,y (navsat OR landmark)
#   odom2 = odometry/ground_height           ABSOLUTE z (DTM terrain + chassis
#                                            clearance), stamped "map". Fused HERE
#                                            TOO, not inherited -- this filter
#                                            estimates z rather than passing it
#                                            through. The odom filter fuses the
#                                            SAME number off a SECOND topic,
#                                            /odometry/ground_height_odom, stamped
#                                            "odom", because each filter needs the
#                                            measurement in its own world_frame.
#                                            See the odom2 block at the end of this
#                                            file; the frame stamp is load-bearing.
#
# THE ODOM-SPOOF ATTACK SURFACE:
# odom0 is husky_velocity_controller/odom, exactly as in the odom-frame filter.
# Between the 2 Hz GPS position corrections this wheel-odometry velocity is the
# ONLY thing moving the fused pose, so injecting a fast, large fake velocity on
# that topic drags the fused (x, y) away from truth faster than GPS can pull it
# back. That is the intended, demonstrable vulnerability. See the README /
# handover notes for the exact rostopic pub payload.
# ---------------------------------------------------------------------------

odom_frame: odom
base_link_frame: base_link
map_frame: map
world_frame: map          # <-- the ONLY substantive difference from the odom EKF

# two_d_mode OFF here TOO. This is the DUAL-EKF trap: turning it off only in
# localization.yaml (the odom filter) makes odom->base_link carry z/roll/pitch, but
# THIS filter owns map->odom and would flatten the composed map->base_link straight
# back to zero -- which is the frame RViz and every map-frame consumer actually use.
# Both filters must agree, or the robot renders flat no matter what the odom one says.
two_d_mode: false
predict_to_current_time: true
frequency: 50

# --- wheel odometry: velocities only (same config as the odom-frame EKF) -----
# We fuse vx, vy, vyaw (NOT absolute x/y/yaw) so wheel odom contributes motion
# without asserting a global position of its own. This is what makes the spoof
# work: a lie about VELOCITY is integrated into the fused POSITION.
odom0: husky_velocity_controller/odom
odom0_config: [false, false, false,
               false, false, false,
               true,  true,  true,
               false, false, true,
               false, false, false]
odom0_differential: false
odom0_queue_size: 10

# --- IMU: yaw rate only (heading now comes from compass/data, see imu1 below) -
# imu/data (imu_link) is mounted rotated 90deg and is unreliable for absolute
# heading, so it no longer fuses orientation here. It still contributes angular
# velocity (vroll, vpitch, vyaw). The driver reads compass/data directly for its
# own steering; see the note in drive_to_point_gps.py.
imu0: imu/data
imu0_config: [false, false, false,
              false, false, false,
              false, false, false,
              true,  true,  true,
              false, false, false]
imu0_differential: true
imu0_queue_size: 10
imu0_remove_gravitational_acceleration: true

# --- Compass: ABSOLUTE world attitude (drift-free) ---------------------------
# /compass/data yaw is the ONLY absolute heading reference. Without it the map
# EKF heading drifts from wheel scrub. Its orientation is gravity-referenced
# (measured live: gravity 9.78 on Z), so it also supplies absolute ROLL and PITCH
# -- now fused as well, so the robot tilts with the terrain instead of being
# forced level. Absolute (differential: false).
imu1: compass/data
imu1_config: [false, false, false,
              true,  true,  true,
              false, false, false,
              false, false, false,
              false, false, false]
imu1_differential: false
imu1_queue_size: 10
imu1_remove_gravitational_acceleration: false

# --- Absolute position anchor: odometry/abs_fix (neutral, dual-source) --------
# odom1 = odometry/abs_fix carries ABSOLUTE x, y in the map frame. The topic is
# named neutrally because its SOURCE depends on the navigation mode:
#   * GPS mode      -> navsat_transform publishes the fix here (its default
#                      output odometry/gps is remapped to odometry/abs_fix in
#                      control.launch). lat/lon -> metres projection + datum done.
#   * Landmark mode -> landmark_localizer publishes here directly, from lidar-vs-
#                      map matching (GPS-free). navsat is not started.
# Either way we fuse x and y ONLY - not yaw (no heading here; compass supplies
# yaw via imu1) and not velocity. This is the anchor that stops the fused pose
# from drifting, and the thing an odom spoof has to fight.
odom1: odometry/abs_fix
odom1_config: [true,  true,  false,
               false, false, false,
               false, false, false,
               false, false, false,
               false, false, false]
odom1_differential: false
odom1_queue_size: 10

# --- Absolute z: odometry/ground_height, stamped "map" (odom2) ---------------
# The same absolute-elevation measurement the odom filter fuses -- but NOT the
# same topic. scripts/publish_ground_height_odom.py publishes the identical
# number twice, differing only in header.frame_id:
#     /odometry/ground_height        stamped "map"    <- THIS filter (odom2)
#     /odometry/ground_height_odom   stamped "odom"   <- the odom filter (odom1)
#
# WHY TWO TOPICS AND NOT ONE. robot_localization transforms a pose measurement
# into world_frame before fusing: preparePose looks up
# `world_frame <- msg.header.frame_id` (ros_filter.cpp ~2713) and applies it with
# poseTmp.mult(targetFrameTrans, poseTmp) (~3021). That transform is the identity
# only when the stamp equals the filter's own world_frame -- and the two filters
# have DIFFERENT world_frames (map here, odom there). One stamp therefore cannot
# serve both: whichever filter it does not match applies a live tf lookup, i.e.
# one of the filters' own outputs, to its own input.
#
# THE HISTORY, because all three wirings were tried and the first two were wrong.
# Write M = (map->base_link).z, O = (odom->base_link).z, T = the true height.
# This filter emits map->odom = M - O (mapOdomTrans.mult(worldBaseLinkTrans,
# baseLinkOdomTrans), ros_filter.cpp ~2025).
#
# 1. ONE topic stamped "odom", fused in both  ->  RUNAWAY IN THIS FILTER.
#    Here targetFrameTrans is map<-odom, z = +(M - O) -- this filter's OWN output
#    fed back into its own input: M := T + (M - O). Measured:
#        /odometry/ground_height  z = 3.768   the measurement, correct
#        odom -> base_link        z = 3.769   correct
#        map  -> odom             z = 1.228   WRONG, should be ~0
#        map  -> base_link        z = 4.997   = 3.768 + 1.228, the double count
#
# 1b. Removed from this filter entirely  ->  OVERCORRECTION.
#    This filter does not PASS z THROUGH; it ESTIMATES it. Nothing else here
#    observes z (odom0 z flag false, imu0/imu1 are orientation-only, odom1
#    abs_fix has its z flag false and carries z=0.0 anyway), so the estimate sat
#    at its initial 0 and the filter published the negated height. Measured:
#        /odometry/ground_height  z =  3.839
#        odom -> base_link        z = +3.839  correct
#        map  -> odom             z = -3.839  WRONG, cancels it exactly
#        map  -> base_link        z = -0.000  robot back underground
#
# 2. ONE topic stamped "map", fused in both  ->  FIXED HERE, BROKE THE ODOM ONE.
#    This filter became correct (map<-map is the identity, M := T), but the odom
#    filter then applied odom<-map, z = -(M - O), fusing T - (M - O) = O: its own
#    estimate. The measurement cancelled itself, so ITS z went unobserved and
#    froze wherever it had drifted. Measured:
#        /odometry/ground_height  z = 3.893   the measurement
#        /odometry/filtered_odom  z = 5.927   O, frozen 2.034 m high
#        map  -> odom             z = -2.034  = M - O, exactly hides the error
#        map  -> base_link        z = 3.893   correct TOTAL, wrong SPLIT
#    Not cosmetic: the local costmap runs in the odom frame
#    (config/costmap_local_gps.yaml, global_frame: odom) and consumed the 2 m
#    error directly.
#
# 3. TWO topics, each stamped in its own filter's world_frame.  <- CURRENT.
#    Both transforms are the identity, so M := T and O := T directly, and
#    map->odom = M - O = 0. Every frame reports the true height at once.
#    The odom-stamped copy is NOT compensated by map->odom -- it is the identical
#    raw number. Compensating it would reintroduce exactly the output-into-input
#    feedback that broke wirings 1 and 2.
#
# Expected in tf once this is right, ALL FOUR AT ONCE:
#     map->odom z ~= 0.000, odom->base_link z ~= map->base_link z ~=
#     /odometry/ground_height z, and /odometry/filtered_odom z the same.
#
# We fuse z ONLY -- the message's x, y and orientation are meaningless and its
# covariance sets them to 1e6. Absolute (differential: false): it is a direct
# measurement of elevation, not a delta.
odom2: odometry/ground_height
odom2_config: [false, false, true,
               false, false, false,
               false, false, false,
               false, false, false,
               false, false, false]
odom2_differential: false
odom2_queue_size: 10
