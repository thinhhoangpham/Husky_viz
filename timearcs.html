
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Husky TimeArcs & Bundling</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { margin:0; font-family: sans-serif; }
.legend { position: fixed; top: 8px; right: 8px; background: rgba(255,255,255,0.9); padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 12px; }
.legend-item { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
.swatch { width: 12px; height: 12px; border-radius: 2px; border: 1px solid #999; }
.tooltip { position: fixed; pointer-events: none; background: rgba(0,0,0,0.8); color: #fff; padding: 6px 8px; border-radius: 4px; font-size: 12px; }
.filter-toggle-container { position: fixed; background: rgba(255,255,255,0.9); padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 12px; display: flex; flex-direction: column; gap: 4px; z-index: 10; }
.filter-toggle-btn { padding: 4px 8px; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; font-size: 11px; transition: all 0.2s; }
.unfinished-filter-btn { background: #8B0000; color: white; border-color: #8B0000; }
.unfinished-filter-btn:hover { background: #A00000; }
.unfinished-filter-btn.active { background: #8B0000; box-shadow: 0 0 4px rgba(139, 0, 0, 0.5); }
.resumed-filter-btn { background: #90EE90; color: #333; border-color: #90EE90; }
.resumed-filter-btn:hover { background: #7ED321; }
.resumed-filter-btn.active { background: #90EE90; box-shadow: 0 0 4px rgba(144, 238, 144, 0.5); }
.normal-filter-btn { background: #4169E1; color: white; border-color: #4169E1; }
.normal-filter-btn:hover { background: #5A7FFF; }
.normal-filter-btn.active { background: #4169E1; box-shadow: 0 0 4px rgba(65, 105, 225, 0.5); }
.show-all-filter-btn { background: #f0f0f0; color: #333; border-color: #ccc; }
.show-all-filter-btn:hover { background: #e0e0e0; }
.show-all-filter-btn.active { background: #4CAF50; color: white; border-color: #4CAF50; box-shadow: 0 0 4px rgba(76, 175, 80, 0.5); }

/* Single panel layout styles */
.main-container { height: 100vh; }
.timearcs-panel { width: 100%; height: 100%; position: relative; }

/* Popup modal styles */
.bundling-popup { 
  position: fixed; 
  top: 0; 
  left: 0; 
  width: 100%; 
  height: 100%; 
  background: transparent; 
  z-index: 1000; 
  display: none; 
  justify-content: center; 
  align-items: center; 
  pointer-events: none; 
}
.bundling-popup-content { 
  background: #1a1a1a; 
  border: 1px solid #555; 
  border-radius: 8px; 
  width: 600px; 
  height: 500px; 
  position: fixed; 
  overflow: hidden; 
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  pointer-events: auto; 
}
.bundling-popup-header { 
  background: rgba(0,0,0,0.8); 
  color: white; 
  padding: 2px 6px; 
  display: flex; 
  justify-content: space-between; 
  align-items: center; 
  cursor: move; 
  user-select: none; 
  font-size: 10px; 
  height: 20px; 
}
.bundling-popup-close { 
  background: none; 
  border: none; 
  color: white; 
  font-size: 18px; 
  cursor: pointer; 
  padding: 0; 
  width: 20px; 
  height: 20px; 
  display: flex; 
  align-items: center; 
  justify-content: center; 
}
.bundling-popup-body { 
  height: calc(100% - 20px); 
  position: relative; 
}
.bundling-svg { width: 100%; height: 100%; }

.panel-title { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.8); color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; z-index: 10; }

/* Dataset selector (top-center, dark to match controls) */
.dataset-control { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 12px; z-index: 20; display: flex; align-items: center; gap: 6px; }
.dataset-control label { font-weight: bold; }
.dataset-control select { background: #1a1a1a; color: #fff; border: 1px solid #555; border-radius: 3px; font-size: 12px; padding: 2px 4px; }

/* Bundling popup trigger button */
.bundling-trigger-btn { 
  position: fixed; 
  background: #4CAF50; 
  color: white; 
  border: none; 
  padding: 6px 12px; 
  border-radius: 4px; 
  cursor: pointer; 
  font-size: 11px; 
  font-weight: bold; 
  z-index: 100; 
}
.bundling-trigger-btn:hover { background: #45a049; }
</style>
</head>
<body>

<div class="main-container">
  <div class="timearcs-panel">
    <div class="panel-title">Time Arcs</div>
    <div class="dataset-control">
      <label for="datasetSelect">Dataset:</label>
      <select id="datasetSelect">
        <option value="umdhusky-data_collection-syscall-auto-gps-no-cam-processed.csv" selected>Autonomous (GPS, no cam)</option>
        <option value="umdhusky-data_collection-syscall-man-gps-no-cam-processed.csv">Manual (GPS, no cam)</option>
        <option value="umdhusky-data_collection-syscall-gps-no-cam-processed.csv">GPS, no cam</option>
        <option value="umdhusky-data_collection-syscall-full-cam-processed.csv">Camera on</option>
      </select>
    </div>
    <!-- Time arcs visualization will be rendered here -->
  </div>
</div>

<!-- Bundling popup trigger button -->
<button id="bundlingTriggerBtn" class="bundling-trigger-btn">Show Hierarchical Bundling</button>

<!-- Bundling popup modal -->
<div id="bundlingPopup" class="bundling-popup">
  <div class="bundling-popup-content">
    <div class="bundling-popup-header">
      <h3>Hierarchical Bundling</h3>
      <button class="bundling-popup-close" id="bundlingPopupClose">&times;</button>
    </div>
    <div class="bundling-popup-body">
      <!-- Bundling visualization will be rendered here -->
    </div>
  </div>
</div>

<div class="legend" id="legend"></div>
<div class="tooltip" id="tooltip" style="display:none;"></div>
<div id="filterToggleBtns" class="filter-toggle-container">
  <button id="showAllFilterBtn" class="filter-toggle-btn show-all-filter-btn active">Show All</button>
  <button id="unfinishedFilterBtn" class="filter-toggle-btn unfinished-filter-btn">Unfinished</button>
  <button id="resumedFilterBtn" class="filter-toggle-btn resumed-filter-btn">Resumed</button>
  <button id="normalFilterBtn" class="filter-toggle-btn normal-filter-btn">Normal</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.17/d3.min.js"></script>
<script src="timearcs.js"></script>
</body>
</html>
