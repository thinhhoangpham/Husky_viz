# Local (rolling-window) costmap for obstacle avoidance.
#
# global_frame is `odom` -- the smooth, locally-consistent frame from the
# odom-frame EKF (/ekf_localization). Obstacle avoidance must NOT depend on the
# absolute (map) pose: the lidar sees "something solid ahead" in the robot's own
# frame, and that fact is true regardless of localization drift or a GPS spoof.
# Anchoring the local costmap to `map` (as before) let a wrong map->odom
# transform misplace obstacles, so the robot drove into real obstacles it had
# marked in the wrong spot. `odom` keeps obstacles correctly placed relative to
# the robot. The GLOBAL costmap stays in `map` for long-range planning.
global_frame: odom
robot_base_frame: base_link

rolling_window: true
width: 10.0
height: 10.0
resolution: 0.05

# EXPERIMENT (obstacles layer type): the obstacle layer below was switched from
# costmap_2d::ObstacleLayer to costmap_2d::VoxelLayer to test whether true 3D
# voxel tracking removes a measured false-obstacle artifact on sloped terrain.
#
# Measured symptom: on the lake terrain the robot sits tilted (map->base_link
# roll -3.88 deg). ObstacleLayer applies min_obstacle_height (0.15) /
# max_obstacle_height (1.2) as FLAT-WORLD absolute-z thresholds in the costmap
# frame, so ground returns on the uphill side exceed 0.15 m and get marked
# LETHAL in a crescent 2.2-5 m from the robot -- 521 in-band points inside
# obstacle_range with zero real objects there (nearest mapped tree 7.88 m).
#
# The layer instance name stays `obstacles` on purpose: VoxelLayer extends
# ObstacleLayer and reads the same per-instance namespace, so the shared
# `obstacles:` block in costmap_common_gps.yaml (observation_sources: os0,
# min_obstacle_height, max_obstacle_height, obstacle_range, raytrace_range)
# keeps resolving. Renaming would silently orphan all of it.
#
# min/max_obstacle_height are deliberately UNCHANGED -- the experiment is
# whether VoxelLayer alone changes the outcome at those same values.
# If this does not help, the fallback is an IMU-based de-tilt filter node.
plugins:
  - {name: obstacles,  type: "costmap_2d::VoxelLayer"}
  - {name: inflation,  type: "costmap_2d::InflationLayer"}

# VoxelLayer-specific params, set HERE (local costmap only) so they do not leak
# into the global costmap namespace. z_resolution 0.10 x z_voxels 16 = a 1.6 m
# tall column from origin_z 0.0, spanning the existing 0.15 .. 1.2 m obstacle
# height band with headroom.
obstacles:
  origin_z: 0.0
  z_resolution: 0.10
  z_voxels: 16
