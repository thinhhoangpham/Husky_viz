# Local (rolling-window) costmap for obstacle avoidance.
#
# global_frame is `odom` -- the smooth, locally-consistent frame from the
# odom-frame EKF (/ekf_localization). Obstacle avoidance must NOT depend on the
# absolute (map) pose: the lidar sees "something solid ahead" in the robot's own
# frame, and that fact is true regardless of localization drift or a GPS spoof.
# Anchoring the local costmap to `map` (as before) let a wrong map->odom
# transform misplace obstacles, so the robot drove into real obstacles it had
# marked in the wrong spot. `odom` keeps obstacles correctly placed relative to
# the robot. The GLOBAL costmap stays in `map` for long-range planning.
global_frame: odom
robot_base_frame: base_link

rolling_window: true
width: 10.0
height: 10.0
resolution: 0.05

plugins:
  - {name: obstacles,  type: "costmap_2d::ObstacleLayer"}
  - {name: inflation,  type: "costmap_2d::InflationLayer"}

# The LOCAL costmap is the sole consumer of live lidar (the global costmap has
# no ObstacleLayer -- see config/costmap_global_gps.yaml), so the entire
# observation config lives in the `obstacles:` block of
# config/costmap_common_gps.yaml, which is loaded into this namespace FIRST.
# There is deliberately NO `obstacles:` override here.
#
# WHY NO OVERRIDE. Commit 7d4f7d7 put an `obstacles: os0: topic:` override in
# this file to point the single observation source at the terrain-relative
# filtered cloud. That fixed marking and broke clearing: the filtered cloud has
# the ground deliberately stripped out, so the layer got marks but almost no
# raytracing rays to clear with, and lethal cells accumulated until the robot
# was boxed in by phantoms (measured: ~4600 lethal cells, nearest 0.73 m, while
# the nearest real tree was 15.21 m away).
#
# The layer now has TWO sources instead -- os0_mark off the filtered cloud and
# os0_clear off the raw cloud -- and both are declared together in
# costmap_common_gps.yaml so the whole marking/clearing story reads in one
# place. It lands in the global namespace too, where the absence of an
# ObstacleLayer makes it inert; that is expected and harmless.
#
# Do NOT reintroduce an `obstacles:` block here to "override just the topic".
# rosparam MERGES dicts, so a partial override cannot remove or rename a source
# and can only resurrect a stale one. Edit costmap_common_gps.yaml instead.
#
# The filter node must be running (RUN-MAP-NAV.md, Terminal 7). If it is not,
# /os0_cloud_node/points_above_terrain has no publisher and NOTHING is ever
# marked -- check for the publisher first before debugging avoidance behaviour.
