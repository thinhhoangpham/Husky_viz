# Global costmap for the GPS-anchored, MAP-BACKED move_base
# (launch/move_base_gps_map.launch). Unlike costmap_global_gps.yaml (mapless,
# rolling window), this loads the preloaded object map as a StaticLayer and
# plans over the WHOLE world at once. Layer order is the additive-lidar rule:
#   static (preloaded objects) -> obstacles (live lidar, ADDS) -> inflation.
# Lidar can only ADD obstacles on top of the static map, never clear it.
#
# There is no terrain layer here. The DTM is deliberately NOT consulted by the
# costmap; terrain will be wired into sensing separately.
global_frame: map
robot_base_frame: base_link

static_map: true
rolling_window: false
# track_unknown_space FALSE: the static map is the plain object map
# (<world>_map.pgm), which is fully known -- every cell is either an object or
# free ground. There are no unknown cells for this flag to track, so tracking
# them only risks the layer inventing NO_INFORMATION where none exists.
track_unknown_space: false

resolution: 0.15

plugins:
  - {name: static,     type: "costmap_2d::StaticLayer"}
  - {name: obstacles,  type: "costmap_2d::ObstacleLayer"}
  - {name: inflation,  type: "costmap_2d::InflationLayer"}

static:
  map_topic: /map
  subscribe_to_updates: false
