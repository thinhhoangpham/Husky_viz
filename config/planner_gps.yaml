# Planner tuning for the GPS-anchored move_base (launch/move_base_gps.launch).
#
# Copied from the dataset's husky_navigation/config/planner.yaml so this repo can
# load it by ABSOLUTE path (repo convention) rather than via $(find husky_navigation).
# Global planner = navfn/NavfnROS; local planner = dwa_local_planner/DWAPlannerROS
# (the TrajectoryPlannerROS block below is inert unless base_local_planner is
# switched to it in the launch).
controller_frequency: 5.0
recovery_behaviour_enabled: true

NavfnROS:
  # allow_unknown FALSE: unknown means "no terrain data here" -- open water, or
  # beyond the terrain mesh -- and the robot must not be routed across it. With
  # this true the planner drove the Husky off the edge of the lake world; it
  # fell, GPS altitude -36401 m. maps/<world>_map_terrain.pgm marks off-terrain
  # cells unknown (pixel 205) precisely so this flag has something to refuse.
  # NOTE this applies to the MAP-BACKED launch. The mapless config keeps
  # allow_unknown true; there, unknown just means "not yet sensed", not water.
  allow_unknown: false
  default_tolerance: 0.1 # tolerance on the goal point for the planner

TrajectoryPlannerROS:
  # Robot Configuration Parameters
  acc_lim_x: 2.5
  acc_lim_theta:  3.2

  max_vel_x: 1.0
  min_vel_x: 0.0

  max_vel_theta: 1.0
  min_vel_theta: -1.0
  min_in_place_vel_theta: 0.2

  holonomic_robot: false
  escape_vel: -0.1

  # Goal Tolerance Parameters
  yaw_goal_tolerance: 0.1
  xy_goal_tolerance: 0.2
  latch_xy_goal_tolerance: false

  # Forward Simulation Parameters
  sim_time: 2.0
  sim_granularity: 0.02
  angular_sim_granularity: 0.02
  vx_samples: 6
  vtheta_samples: 20
  controller_frequency: 20.0

  # Trajectory scoring parameters
  meter_scoring: true
  occdist_scale:  0.1
  pdist_scale: 0.75
  gdist_scale: 1.0

  heading_lookahead: 0.325
  heading_scoring: false
  heading_scoring_timestep: 0.8
  dwa: true
  simple_attractor: false
  publish_cost_grid_pc: true

  # Oscillation Prevention Parameters
  oscillation_reset_dist: 0.25
  escape_reset_dist: 0.1
  escape_reset_theta: 0.1

DWAPlannerROS:
  # Robot configuration parameters
  acc_lim_x: 2.5
  acc_lim_y: 0
  acc_lim_th: 3.2

  max_vel_x: 1.2
  min_vel_x: -0.3
  max_vel_y: 0
  min_vel_y: 0

  max_trans_vel: 1.2
  min_trans_vel: 0.1
  max_rot_vel: 1.0
  min_rot_vel: 0.2

  # Goal Tolerance Parameters
  yaw_goal_tolerance: 0.3
  xy_goal_tolerance: 0.35
  latch_xy_goal_tolerance: true

  # Forward simulation
  sim_time: 1.7
  sim_granularity: 0.025
  vx_samples: 8
  vy_samples: 1
  vth_samples: 20

  # Trajectory scoring -- occdist_scale RAISED well above the 0.01 default so the
  # planner strongly prefers trajectories that keep clearance from obstacles
  # (fixes the tight-corner graze). path/goal biases keep it progressing.
  path_distance_bias: 34.0
  goal_distance_bias: 20.0
  occdist_scale: 0.4
  forward_point_distance: 0.325
  stop_time_buffer: 0.2
  scaling_speed: 0.25
  max_scaling_factor: 0.2

  # Oscillation prevention
  oscillation_reset_dist: 0.05

  # Diagnostic only: publishes /move_base/DWAPlannerROS/cost_cloud, for
  # investigating the DWA unreachable-goal stall (see
  # docs/dwa-unreachable-goal-investigation.md). Read-only w.r.t. control --
  # dwa_planner.cpp reads it once at construction (line 156) and its only
  # other use gates a single map_viz_.publishCostCloud(...) call (line 368);
  # it cannot affect planner decisions, which are decided separately by
  # result_traj_.cost_ < 0 after that call. Read once via
  # private_nh.param(...), so it is NOT dynamic_reconfigure-settable --
  # requires a move_base restart to take effect. Gotcha for the cloud reader:
  # getCellCosts returns false for blocked/unreachable cells, so those cells
  # are ABSENT from the cloud rather than present with a sentinel -- absence
  # is the signal.
  publish_cost_grid_pc: true
