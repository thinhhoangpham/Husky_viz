# Shared costmap params for the GPS-anchored (map-frame) move_base, loaded into
# BOTH global_costmap and local_costmap namespaces by launch/move_base_gps.launch.
#
# NOTE on structure: because the costmaps declare `plugins:`, every layer reads
# its parameters from ITS OWN namespace, named after the plugin instance. Putting
# observation_sources at the costmap root (the pre-Hydro layout) is silently
# ignored -- the costmap then subscribes to nothing and stays empty, which is
# exactly the bug that let the robot drive into a tree with move_base running.
# So the sensor config lives under `obstacles:` and the inflation under `inflation:`.

# Husky is 0.99 x 0.67 m. Footprint taken from the dataset costmap_common.yaml
# (a skid-steer that scrubs sideways while turning; the box is conservative).
footprint: [[-0.5, -0.33], [-0.5, 0.33], [0.5, 0.33], [0.5, -0.33]]
footprint_padding: 0.01

robot_base_frame: base_link
update_frequency: 4.0
publish_frequency: 3.0
transform_tolerance: 0.5

obstacles:
  # The OS0 is a 3D PointCloud2, which costmap_2d reads natively -- no
  # pointcloud_to_laserscan bridge needed. This observation block MIRRORS the
  # one in repo-root config/costmap_common.yaml exactly, only the ranges are
  # opened up (5.0 / 6.0) because the map-frame costmap is drift-free and can
  # safely see obstacles a little further out.
  observation_sources: os0
  os0:
    sensor_frame: os0_lidar
    data_type: PointCloud2
    # NOTE: the LOCAL costmap overrides this topic in
    # config/costmap_local_gps.yaml to point at the terrain-relative filtered
    # cloud. This raw topic remains the default here only because this file is
    # also loaded into the global namespace, which instantiates no
    # ObstacleLayer and therefore ignores the whole block.
    topic: /os0_cloud_node/points
    marking: true             # add obstacles where rays hit
    clearing: true            # clear free space along the ray
    # THE HEIGHT GATE HERE IS DELIBERATELY NEUTERED -- see below.
    #
    # costmap_2d's gate is a scalar comparison against z in the COSTMAP frame.
    # That assumes flat ground at a known height, which is false on any world
    # with relief: measured in the lake world, ground returns smear across
    # absolute z 4.24..4.56 m and that smear MOVES as the robot drives, while
    # the SAME returns sit within 7 mm of each other when measured against
    # their own terrain cell. The old 0.15-1.2 m band was the cause of the
    # crescent of false lethal cells 2-5 m ahead of the robot, and after commit
    # 07cd63c gave the robot true altitude it referred to a band ~4 m
    # UNDERGROUND, so it could not have been selecting obstacles at all.
    #
    # The real test now lives in scripts/filter_cloud_above_terrain.py, which
    # looks the terrain height up per point from the world's DTM and keeps only
    # returns 0.40-3.00 m above the ground BENEATH THAT POINT. These bounds are
    # opened wide so this gate can never fire and second-guess it. Do not
    # re-tighten them: any value here is an absolute-z test and is wrong by
    # construction.
    min_obstacle_height: -1000.0
    max_obstacle_height: 1000.0
    obstacle_range: 5.0
    raytrace_range: 6.0

inflation:
  inflation_radius: 0.5
  cost_scaling_factor: 6.0
