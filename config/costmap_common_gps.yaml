# Shared costmap params for the GPS-anchored (map-frame) move_base, loaded into
# BOTH global_costmap and local_costmap namespaces by launch/move_base_gps.launch.
#
# NOTE on structure: because the costmaps declare `plugins:`, every layer reads
# its parameters from ITS OWN namespace, named after the plugin instance. Putting
# observation_sources at the costmap root (the pre-Hydro layout) is silently
# ignored -- the costmap then subscribes to nothing and stays empty, which is
# exactly the bug that let the robot drive into a tree with move_base running.
# So the sensor config lives under `obstacles:` and the inflation under `inflation:`.

# Husky is 0.99 x 0.67 m. Footprint taken from the dataset costmap_common.yaml
# (a skid-steer that scrubs sideways while turning; the box is conservative).
footprint: [[-0.5, -0.33], [-0.5, 0.33], [0.5, 0.33], [0.5, -0.33]]
footprint_padding: 0.01

robot_base_frame: base_link
update_frequency: 4.0
publish_frequency: 3.0
transform_tolerance: 0.5

obstacles:
  # ---------------------------------------------------------------------------
  # THERE ARE TWO SEPARATE HEIGHT GATES AND BOTH MUST BE NEUTERED.
  #
  #   1. LAYER-LEVEL  -> `obstacles: max_obstacle_height` (right here).
  #   2. PER-SOURCE   -> `obstacles: os0: {min,max}_obstacle_height` (below).
  #
  # ObstacleLayer applies its OWN layer-level gate independently of, and in
  # addition to, whatever each observation source declares. Commit 7d4f7d7
  # widened only the per-source pair and therefore fixed just half the problem:
  # the layer-level value stayed at costmap_2d's stock default of 2.0 and kept
  # silently discarding the entire cloud. Measured symptom: a mapped tree 3.38 m
  # ahead, 244 filtered returns on it inside obstacle_range, and 0 lethal cells;
  # raising this one parameter at runtime produced 493 lethal cells instantly.
  #
  # BOTH GATES TEST ABSOLUTE z IN THE COSTMAP FRAME (odom for the local
  # costmap). They are NOT robot-relative, despite what the names suggest. The
  # 2.0 default only ever appeared to work because base_link used to sit at
  # z ~ 0; since commit 07cd63c gave the robot true altitude (base_link ~3.84 m)
  # every real return is above 2.0 m, so the layer threw away all of them.
  #
  # VALUE: 50.0 is the DECLARED MAXIMUM of this parameter -- see
  # /opt/ros/noetic/include/costmap_2d/ObstaclePluginConfig.h (min 0.0,
  # max 50.0, default 2.0). Anything larger is silently clamped down to 50.0,
  # which is exactly what `dynparam set ... 1000.0` did. 50.0 is far above
  # anything in this world (terrain 3.5..5.9 m, tree canopy ~7.6 m in odom) with
  # room for the robot's altitude to vary, so this gate can never fire.
  #
  # There is NO layer-level `min_obstacle_height`: ObstaclePluginConfig declares
  # max_obstacle_height only, and the minimum exists solely per-source (it is a
  # constructor argument of costmap_2d::ObservationBuffer). Adding one here
  # would be a dead parameter -- do not.
  #
  # The REAL obstacle-height decision now lives in
  # scripts/filter_cloud_above_terrain.py, which tests each point's height ABOVE
  # THE TERRAIN DIRECTLY BENEATH IT (band 0.40..3.00 m), so it stays correct on
  # slopes and at any robot altitude. The 3.00 m upper bound is DELIBERATE
  # overhead clearance so the robot can drive UNDER tree canopies: measured in
  # this world, 400 of 416 cells carrying canopy returns have nothing at all in
  # the 0.40-3.00 m band, i.e. they are pure overhang. Drop that upper bound and
  # the ground beneath every tree becomes lethal. KEEP IT.
  #
  # SCOPE NOTE -- DO NOT "CLEAN THIS UP" BY SPLITTING THE FILE. This file is
  # loaded into BOTH the global_costmap and local_costmap namespaces
  # (launch/move_base_gps_map.launch). The global costmap instantiates NO
  # ObstacleLayer at all (commit ecb0634, a deliberate decision), so this whole
  # block lands in the global namespace and is simply ignored. That is expected
  # and harmless. Splitting the file to "tidy" it removes these params from the
  # local costmap and reinstates the bug.
  # ---------------------------------------------------------------------------
  max_obstacle_height: 50.0

  # The OS0 is a 3D PointCloud2, which costmap_2d reads natively -- no
  # pointcloud_to_laserscan bridge needed. This observation block MIRRORS the
  # one in repo-root config/costmap_common.yaml exactly, only the ranges are
  # opened up (5.0 / 6.0) because the map-frame costmap is drift-free and can
  # safely see obstacles a little further out.
  observation_sources: os0
  os0:
    sensor_frame: os0_lidar
    data_type: PointCloud2
    # NOTE: the LOCAL costmap overrides this topic in
    # config/costmap_local_gps.yaml to point at the terrain-relative filtered
    # cloud. This raw topic remains the default here only because this file is
    # also loaded into the global namespace, which instantiates no
    # ObstacleLayer and therefore ignores the whole block.
    topic: /os0_cloud_node/points
    marking: true             # add obstacles where rays hit
    clearing: true            # clear free space along the ray
    # THE PER-SOURCE HEIGHT GATE. DELIBERATELY NEUTERED. This is gate 2 of 2;
    # gate 1 is the layer-level max_obstacle_height at the top of this block,
    # and BOTH must stay wide or the layer discards the cloud on its own.
    #
    # costmap_2d's gate is a scalar comparison against z in the COSTMAP frame.
    # That assumes flat ground at a known height, which is false on any world
    # with relief: measured in the lake world, ground returns smear across
    # absolute z 4.24..4.56 m and that smear MOVES as the robot drives, while
    # the SAME returns sit within 7 mm of each other when measured against
    # their own terrain cell. The old 0.15-1.2 m band was the cause of the
    # crescent of false lethal cells 2-5 m ahead of the robot, and after commit
    # 07cd63c gave the robot true altitude it referred to a band ~4 m
    # UNDERGROUND, so it could not have been selecting obstacles at all.
    #
    # The real test now lives in scripts/filter_cloud_above_terrain.py, which
    # looks the terrain height up per point from the world's DTM and keeps only
    # returns 0.40-3.00 m above the ground BENEATH THAT POINT. These bounds are
    # opened wide so this gate can never fire and second-guess it. Do not
    # re-tighten them: any value here is an absolute-z test and is wrong by
    # construction.
    min_obstacle_height: -1000.0
    max_obstacle_height: 1000.0
    obstacle_range: 5.0
    raytrace_range: 6.0

inflation:
  inflation_radius: 0.5
  cost_scaling_factor: 6.0
